defaults:
  - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: rgb
obs_size: 64
time_limit: 125
num_frames: 3

# evaluation
checkpoint: ???
checkpoint_buffer: ???
eval_episodes: 10
eval_freq: 50000

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
buffer_storage_device: ???
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: ???
wandb_entity: ???
wandb_group_name: ???
wandb_run_name: ???
wandb_run_id: ???
wandb_silent: false
disable_wandb: true
save_csv: true

# CausalWorld
difficulty: ???

# misc
save_video: true
save_agent: true
seed: 1
save_every: 10000
save_checkpoint_wandb: false

# slot extractor
n_slots: 5
slot_dim: 64
slot_extractor_checkpoint_path: ???

# dinosaur
dino_model_name: vit_base_patch16_224_dino
input_feature_dim: 768
num_patches: 196
features: [ 2048, 2048, 2048 ]
slot_extractor_device: cuda

# compas dynamics
compas_dynamics_checkpoint_path: ???
compas_tokens_dim: ???
compas_max_timestep: ???
compas_projected_actions_dim: ???
compas_num_heads: ???
compas_num_layers: ???
compas_hidden_mult: ???
compas_parallel: ???

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

# collect dataset
do_collect_episodes: false
n_train_episodes: ???
n_val_episodes: ???
dataset_path: ???
epsilon_greedy_start: 1.0
epsilon_greedy_end: 0.0
noise_scale_start: 2.8
noise_scale_end: 0.0
